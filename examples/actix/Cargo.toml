[package]
name = "example-actix"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
slate = { path = "../..", features = ["actix"] }
rust-embed = "8"
actix-web = { version = "4", default-features = false, features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
tracing-subscriber = "0.3"
