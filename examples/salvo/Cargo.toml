[package]
name = "example-salvo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
slate = { path = "../..", features = ["salvo"] }
rust-embed = "8"
salvo = { version = "0.93", default-features = false, features = ["server", "http1"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
tracing-subscriber = "0.3"
