[package]
name = "example-warp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
slate = { path = "../..", features = ["warp"] }
rust-embed = "8"
warp = { version = "0.4", default-features = false, features = ["server"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
tracing-subscriber = "0.3"
